  <script type="application/ld+json">{"@context":{"@version":1.1,"@vocab":"https://schema.org/","url":{"@id":"https://schema.org/url","@type":"@id"}},"@id":"https://getharsh.in/about/","@type":"ProfilePage","creativeWorkStatus":"published","description":"The curiosity, experiences and people behind my practice.","http://www.w3.org/ns/prov#wasGeneratedBy":{"@type":"http://www.w3.org/ns/prov#Activity","http://www.w3.org/ns/prov#used":[{"@id":"https://rawthoughts.in/gazette/"},{"@id":"https://github.com/getHarshOnline/gazette-theme-chronicle"}]},"identifier":"content:getharsh-about","inLanguage":"en","mainEntity":{"@id":"https://getharsh.in/#person","@type":"Person","identifier":"person:harsh","name":"Harsh Joshi","sameAs":[{"@id":"https://github.com/getHarsh"},{"@id":"https://www.linkedin.com/in/getharsh/"}],"url":"https://getharsh.in/about/"},"mentions":[{"@id":"https://rawthoughts.in/gazette/#entity","@type":"SoftwareApplication","description":"Publish a body of thought from the whole to its parts, with collections, journeys and crossings that readers, search and machines all follow. Gazette compiles the writing, research and documentation you choose into one publication or several connected ones.","http://purl.org/dc/terms/isPartOf":{"@id":"https://rawthoughts.in/#brand"},"http://purl.org/dc/terms/relation":{"@id":"https://github.com/getHarshOnline/gazette","@type":"SoftwareSourceCode","author":{"@id":"https://getharsh.in/#person"},"citation":{"@id":"https://github.com/getHarshOnline/gazette/blob/main/CITATION.cff"},"codeRepository":"https://github.com/getHarshOnline/gazette","copyrightHolder":{"@id":"https://rawthoughts.in/#organization","@type":"Organization","identifier":"organization:rtepl","name":"RawThoughts Enterprises Private Limited","sameAs":[{"@id":"https://github.com/getHarshOnline"}],"url":"https://rawthoughts.in/"},"license":{"@id":"https://github.com/getHarshOnline/gazette/blob/main/LICENSE"},"targetProduct":{"@id":"https://rawthoughts.in/gazette/#entity"}},"identifier":"project:gazette","name":"Gazette","subjectOf":[{"@id":"https://rawthoughts.in/gazette/","@type":"CollectionPage","identifier":"content:gazette-introduction","name":"Gazette","url":"https://rawthoughts.in/gazette/"},{"@id":"https://rawthoughts.in/gazette/first-publication/#article","@type":"TechArticle","identifier":"content:gazette-docs","name":"Your first publication","url":"https://rawthoughts.in/gazette/first-publication/"},{"@id":"https://rawthoughts.in/gazette/mentions/","@type":"CollectionPage","identifier":"content:gazette-mentions","name":"Gazette mentions","url":"https://rawthoughts.in/gazette/mentions/"},{"@id":"https://docs.rawthoughts.in/gazette/overview"}]},{"@id":"https://rawthoughts.in/pale/#entity","@type":"SoftwareApplication","description":"Write your world once, and Pale compiles it into the permissions and context the coding tools you already use ask for at every step.","http://purl.org/dc/terms/isPartOf":{"@id":"https://rawthoughts.in/#brand"},"http://purl.org/dc/terms/relation":{"@id":"https://github.com/getHarshOnline/pale","@type":"SoftwareSourceCode","author":{"@id":"https://getharsh.in/#person"},"citation":{"@id":"https://github.com/getHarshOnline/pale/blob/main/CITATION.cff"},"codeRepository":"https://github.com/getHarshOnline/pale","copyrightHolder":{"@id":"https://rawthoughts.in/#organization"},"license":{"@id":"https://github.com/getHarshOnline/pale/blob/main/LICENSE"},"targetProduct":{"@id":"https://rawthoughts.in/pale/#entity"}},"identifier":"project:pale","name":"Pale","subjectOf":[{"@id":"https://rawthoughts.in/pale/","@type":"CollectionPage","identifier":"content:pale-project","name":"Pale","url":"https://rawthoughts.in/pale/"},{"@id":"https://rawthoughts.in/pale/understand-your-world/#article","@type":"TechArticle","identifier":"content:pale-docs","name":"Introduction to Pale","url":"https://rawthoughts.in/pale/understand-your-world/"},{"@id":"https://rawthoughts.in/pale/mentions/","@type":"CollectionPage","identifier":"content:pale-mentions","name":"Pale mentions","url":"https://rawthoughts.in/pale/mentions/"},{"@id":"https://docs.rawthoughts.in/pale/overview"}]},{"@id":"https://post-agi-economics.org/#entity","@type":"ResearchProject","brand":{"@id":"https://post-agi-economics.org/#brand"},"description":"Research into production, scarcity, distribution and the models we use when cognitive work becomes cheaper.","http://purl.org/dc/terms/hasPart":[{"@id":"https://post-agi-economics.org/one-yardstick/#entity"}],"identifier":"project:post-agi-economics","name":"Post-AGI Economics","subjectOf":[{"@id":"https://post-agi-economics.org/","@type":"WebPage","identifier":"content:post-agi-economics-home","name":"When intelligence gets cheap","url":"https://post-agi-economics.org/"}]}],"name":"About Harsh Joshi","publisher":{"@id":"https://getharsh.in/#person"},"text":"I grew up in Lucknow, with roots in Almora.\nI studied Electronics and Communication Engineering at Dehradun Institute of Technology, under Uttarakhand Technical University, from 2012 to 2016. I also studied remote sensing and satellite navigation through IIRS. My formal training began in electronics, but my reading never stayed there. Questions about time led into philosophy and texts such as the Katha Upanishad. Building circuits and reading a dialogue between Nachiketa and Yama were different ways of spending an afternoon, yet both could leave me wondering whether I had understood the question at all.\nI have bought more books than I can read, played piano, made art, trained for MMA tournaments and hiked through much of India, spending time in monasteries along the way. You could call it an extensive period of regression testing on a personal front. Work has been just as exploratory. The people I could learn from often mattered as much as the job. In an early team, I could be cleaning the office floor, testing a PCB, designing an algorithm, writing firmware, talking to a vendor or helping someone else find their way into the problem. That breadth was an education in how much surrounds the apparently technical task.\nBuilding with other people\nMy first research grew from an undergraduate thesis, Project Netra, with NEFORD and ICAR-CSSRI\u0027s Regional Research Station in Lucknow. We were investigating inexpensive image analysis and embedded measurement for reclaiming sodic soil. It put the question of what a measurement means beside the people who needed to use it. During those college years I was a Google Student Ambassador and received NRDC Young Innovator and Intel Innovator recognition. The research also took me into guest lectures at IISR, IWMI in Laos, IIRS Dehradun, Pantnagar University and Allahabad University: another way of finding out whether I could make the work intelligible to somebody else.\nSmart Joules grew from idea stage to Series A. I joined as its founding engineer in November 2016 and progressed to Product Development Lead, working across DeJoule, JouleLabs and JouleMind through March 2020. I also represented the work outside the plant: on the panel at NREDCAP’s Powering Andhra Pradesh summit and at Shell’s Make the Future in Singapore.\nField work changed what I expected from engineering. The operator needed a usable control, not our internal picture of the network. At the same time, building the team meant explaining the purpose of the work and making room for people to contribute. I founded and ran JouleLabs around that connection: students and mentors working on real problems, with support that continued beyond handing over a brief.\nAt Zenoti, customer evidence pushed me in another direction. Support, onboarding and taxation for small businesses needed a simpler experience inside a much broader suite. Understanding more of the system let us ask less of the customer. It also changed my sense of ambition: removing the right complexity can be harder, and more useful, than adding another feature.\nFinding a way to build\nWhile I was discovering myself, I was also putting bread on the table: building ventures as an adviser and consultant, building two startups from zero as a founder, and working as a product manager in a startup that had already scaled. AI ran through all of it. I was lucky in the people I got to learn from, including people who had spent longer in the industry than I had been alive.\nMy work with Sachait Technologies Pvt. Ltd. grew from helping friends into cofounder responsibility for product and engineering. Emergency response made the gap between detecting an event and helping a person impossible to overlook: false alarms, human review and the next responder all belonged to the product. That work continued as YOJN Care. In October 2022, I co-founded DAO Studio with Shashwat Pandey. Amul and Lijjat Papad inspired its original ambition: help people create decentralised autonomous organisations. Exploring how AI could support that ambition led into making intelligence easier to use. I led its product, technology and company work through September 2024, and built YojnAI as an individual contributor. Composing model and tool work, inspecting the path and learning from feedback brought earlier product questions into a new technical setting.\nIn September 2024 I built a reflection agent for code and for structured OpenAPI and gRPC specifications with Specmatic. Later work brought me into engineering leadership at Accacia and GPU-cloud product work at AION. The settings changed what I needed to understand: an agreement between services, the meaning inside a building-material document, the workload behind a compute purchase. I kept product responsibility close to hands-on engineering. Organising a team did not remove my desire to understand the mechanism; it made explaining its consequences to other people more important.\nMy interests widened with those changes. Compute became a question about useful capacity and the economic arrangements around it. I also found myself building explanations alongside products. A writer arriving at a technical subject needs more than a title; an engineer making a product decision needs more than a summary. Finding the connection between the predicament, the mechanism and the argument became another part of the work.\nA practice beyond the job\nTeaching has stayed with me. I volunteer with and help lead UPAI, the Uttar Pradesh AI community. Lucknow AI Labs, or LAI, is its founding Lucknow chapter. A student\u0027s question or a collaborator\u0027s objection can reveal something I had stopped noticing. I am interested in education that gives curiosity a rigorous path, including the patience and support to follow it after the first explanation stops being enough.\nShared research asks something beyond explaining an answer. People need a question they can actually work on together, with room for different contributions and a way to examine what those contributions changed. My own curiosity has moved through geometry, time, learning and the organisation of intelligence. Across those forms, I keep asking what causes what, how I could tell, and what that understanding lets me change. Keeping an ambition alive while becoming less attached to its first explanation has been an important part of that movement.\nPersonal life changes the work as well. A venture that occupies every hour cannot be judged only by the elegance of its product. Relationships, family and the possibility of continuing matter. I have become more interested in what can endure, and in what remains useful when an experiment ends, without pretending that every detour was part of a plan.\nToday I bring that practice to consulting at RawThoughts. Alongside it, I am building Pale so people and agents can continue work across their applications, and Gazette so connected writing, research and documentation can become publications people can explore. Agents decide far more often than people, so by the time one writes, what it read has usually changed; I am building Weave and Scope so the people and agents who share a piece of work can still act on a current picture of it. Causality takes the inquiry into adaptive models and architectures: how small reasoning units might learn to organise, and how a system can change its description of a problem. Post-AGI Economics follows what cheaper machine agency changes in production and ordinary life. The environment I want to work in is part of the construction, not simply a set of tools around it.\nArt, music and cultural reading are not decorations added after the serious work. An image can make a relation visible; a sequence can change what it means; a tradition can resist the interpretation I arrived with. My graphic novel Sleepwalker gives those encounters a world to develop in. Working through different forms lets another kind of question appear. There are questions for which a working system is the right response, and others that need a proof, a conversation or an image. I would rather find the right form than make every curiosity serve a professional label.\nI\u0027m also open to the right role: AI work with real ownership, inside a larger organisation. If that sounds like a conversation worth having, write to me. My résumé is available on request. For a longer conversation in another form, I have spoken on The Naked Product and Strategy of Finance.\n","url":"https://getharsh.in/about/","usageInfo":{"@id":"https://getharsh.in/terms/"}}</script>
